<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#164e63">
  <title>Absensi Sholat Dzuhur — V3</title>
  <!-- BUILD: KAMERA_V3_CAMERA_ID -->

  <!-- Dipasang di domain eksternal HTTPS, misalnya GitHub Pages -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef6f8;
      color: #17313a;
    }
    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }
    h1 {
      margin: 0;
      font-size: 23px;
      color: #164e63;
      text-align: center;
    }
    .subtitle {
      margin: 6px 0 18px;
      text-align: center;
      color: #60777f;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #b9cbd1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    #reader {
      width: 100%;
      min-height: 40px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 14px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    button, .file-label {
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: #0e7490; color: #fff; }
    .secondary { background: #e4eef1; color: #164e63; }
    .success { background: #15803d; color: #fff; }
    .danger { background: #b42318; color: #fff; }
    .file-label {
      display: block;
      margin-top: 10px;
      background: #e4eef1;
      color: #164e63;
    }
    #fileInput { display: none; }
    #result {
      display: none;
      margin-top: 14px;
      padding: 15px;
      border: 1px solid #7cc69a;
      border-radius: 12px;
      background: #effbf3;
    }
    .detected {
      color: #15803d;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    #studentName {
      margin: 7px 0 4px;
      font-size: 20px;
      font-weight: 800;
    }
    #scanTime { color: #536b73; }
    #status {
      min-height: 22px;
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 14px;
      background: #f2f5f6;
      color: #40565e;
    }
    #status.ok { background: #e9f8ee; color: #166534; }
    #status.error { background: #fff0ee; color: #9f1d15; }
    .note {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #6b7f86;
    }
    #file-reader { display: none; }
    iframe { display: none; width: 0; height: 0; border: 0; }
  </style>
</head>

<body>
  <main class="app">
    <h1>Absensi Sholat Dzuhur</h1>
    <p class="subtitle">Pindai QR siswa, periksa nama, lalu tekan OK.<br><strong>Versi Kamera 3 — Camera ID</strong></p>

    <label for="tanggal">Tanggal absensi</label>
    <input type="date" id="tanggal">

    <div class="actions">
      <button id="startButton" class="primary" type="button">
        Aktifkan Kamera
      </button>
      <button id="stopButton" class="secondary" type="button" disabled>
        Matikan Kamera
      </button>
    </div>

    <label class="file-label" for="fileInput">
      Alternatif: pindai dari foto QR
    </label>
    <input id="fileInput" type="file" accept="image/*" capture="environment">

    <div id="reader"></div>
    <div id="file-reader"></div>

    <section id="result">
      <div class="detected">QR terdeteksi</div>
      <div id="studentName">-</div>
      <div id="scanTime">-</div>

      <div class="actions">
        <button id="saveButton" class="success" type="button">
          OK — Simpan
        </button>
        <button id="cancelButton" class="danger" type="button">
          Batal
        </button>
      </div>
    </section>

    <div id="status">Kamera belum diaktifkan.</div>

    <p class="note">
      Halaman ini harus dibuka dari alamat HTTPS yang di-host di luar
      Google Apps Script, misalnya GitHub Pages.
    </p>

    <iframe id="gasFrame" name="gasFrame" title="Pengiriman data"></iframe>
  </main>

  <script>
    // ==========================================================
    // WAJIB DIGANTI dengan URL Web App Google Apps Script /exec
    // ==========================================================
    const WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbxStMZ9sQTEByf7R6y_L3CxPcPDrNQMg3BVVJ4Fh1GORWj8ker9StCo6rQh7kDjoVRk7A/exec';

    let cameraScanner = null;
    let fileScanner = null;
    let cameraRunning = false;
    let scanLocked = false;
    let currentRawQr = '';
    let pendingNonce = '';
    let saveTimer = null;

    const el = {
      tanggal: document.getElementById('tanggal'),
      startButton: document.getElementById('startButton'),
      stopButton: document.getElementById('stopButton'),
      fileInput: document.getElementById('fileInput'),
      result: document.getElementById('result'),
      studentName: document.getElementById('studentName'),
      scanTime: document.getElementById('scanTime'),
      saveButton: document.getElementById('saveButton'),
      cancelButton: document.getElementById('cancelButton'),
      status: document.getElementById('status')
    };

    setToday();
    el.startButton.addEventListener('click', startCamera);
    el.stopButton.addEventListener('click', stopCamera);
    el.saveButton.addEventListener('click', submitAttendance);
    el.cancelButton.addEventListener('click', cancelScan);
    el.fileInput.addEventListener('change', scanFromFile);
    window.addEventListener('message', handleBackendMessage);

    function setToday() {
      const now = new Date();
      const localDate = new Date(
        now.getTime() - now.getTimezoneOffset() * 60000
      ).toISOString().slice(0, 10);
      el.tanggal.value = localDate;
    }

    function setStatus(message, type = '') {
      el.status.textContent = message;
      el.status.className = type;
    }

    async function startCamera() {
      if (cameraRunning) return;

      if (!window.Html5Qrcode) {
        setStatus(
          'Library QR gagal dimuat. Periksa koneksi internet.',
          'error'
        );
        return;
      }

      el.startButton.disabled = true;
      setStatus('Mencari perangkat kamera...');

      try {
        /*
         * Cara paling stabil:
         * ambil daftar kamera, lalu jalankan scanner memakai camera ID.
         * Tidak memakai facingMode sama sekali.
         */
        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {
          throw new Error('Tidak ada perangkat kamera yang ditemukan.');
        }

        /*
         * Di HP, utamakan kamera belakang.
         * Di laptop, gunakan kamera pertama yang tersedia.
         */
        const preferredCamera =
          devices.find(function(device) {
            const label = String(device.label || '').toLowerCase();
            return (
              label.includes('back') ||
              label.includes('rear') ||
              label.includes('environment') ||
              label.includes('belakang')
            );
          }) || devices[0];

        cameraScanner = new Html5Qrcode('reader');

        const config = {
          fps: 10,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(
              Math.min(viewfinderWidth, viewfinderHeight) * 0.72
            );
            return { width: size, height: size };
          },
          aspectRatio: 1.333334
        };

        await cameraScanner.start(
          preferredCamera.id,
          config,
          onScanSuccess,
          function() {
            // Kesalahan pembacaan tiap frame diabaikan.
          }
        );

        cameraRunning = true;
        el.stopButton.disabled = false;

        const cameraLabel =
          preferredCamera.label || 'kamera terpilih';

        setStatus(
          'Kamera aktif: ' + cameraLabel +
          '. Arahkan ke QR siswa.',
          'ok'
        );
      } catch (error) {
        cameraScanner = null;
        el.startButton.disabled = false;
        el.stopButton.disabled = true;

        setStatus(
          'Kamera gagal dibuka: ' +
          readableCameraError(error),
          'error'
        );
      }
    }

    async function stopCamera() {
      if (!cameraScanner || !cameraRunning) return;

      try {
        await cameraScanner.stop();
        await cameraScanner.clear();
      } catch (ignored) {}

      cameraScanner = null;
      cameraRunning = false;
      scanLocked = false;
      el.startButton.disabled = false;
      el.stopButton.disabled = true;
      el.result.style.display = 'none';
      setStatus('Kamera dimatikan.');
    }

    async function scanFromFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      try {
        setStatus('Membaca QR dari gambar...');
        fileScanner = new Html5Qrcode('file-reader');
        const decodedText = await fileScanner.scanFile(file, true);
        await onScanSuccess(decodedText);
      } catch (error) {
        setStatus(
          'QR tidak terbaca dari foto. Ambil foto lebih dekat dan jelas.',
          'error'
        );
      } finally {
        try {
          if (fileScanner) await fileScanner.clear();
        } catch (ignored) {}
        fileScanner = null;
      }
    }

    async function onScanSuccess(decodedText) {
      if (scanLocked) return;

      const cleanText = String(decodedText || '').trim();
      if (!cleanText) return;

      scanLocked = true;
      currentRawQr = cleanText;

      if (cameraScanner && cameraRunning) {
        try { cameraScanner.pause(true); } catch (ignored) {}
      }

      const now = new Date();
      el.studentName.textContent = labelFromQr(cleanText);
      el.scanTime.textContent =
        'Waktu scan: ' +
        now.toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

      el.result.style.display = 'block';
      el.saveButton.disabled = false;
      el.cancelButton.disabled = false;
      setStatus('Periksa nama, lalu tekan OK — Simpan.');
    }

    function labelFromQr(raw) {
      try {
        const data = JSON.parse(raw);
        return data.nama || data.name || data.nis ||
               data.id || data.kode || raw;
      } catch (ignored) {}

      const parts = raw.split('|').map(x => x.trim()).filter(Boolean);
      return parts.length > 1 ? parts[parts.length - 1] : raw;
    }

    function submitAttendance() {
      if (!currentRawQr) {
        setStatus('Belum ada QR yang dipindai.', 'error');
        return;
      }

      if (!el.tanggal.value) {
        setStatus('Pilih tanggal absensi terlebih dahulu.', 'error');
        return;
      }

      if (
        !WEB_APP_URL ||
        WEB_APP_URL === 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT'
      ) {
        setStatus(
          'WEB_APP_URL pada index.html belum diisi.',
          'error'
        );
        return;
      }

      el.saveButton.disabled = true;
      el.cancelButton.disabled = true;
      setStatus('Menyimpan ke Google Spreadsheet...');

      pendingNonce =
        Date.now().toString(36) +
        Math.random().toString(36).slice(2);

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = WEB_APP_URL;
      form.target = 'gasFrame';

      addField(form, 'tanggal', el.tanggal.value);
      addField(form, 'qr', currentRawQr);
      addField(form, 'nonce', pendingNonce);

      document.body.appendChild(form);
      form.submit();
      form.remove();

      clearTimeout(saveTimer);
      saveTimer = setTimeout(function() {
        if (!pendingNonce) return;
        el.saveButton.disabled = false;
        el.cancelButton.disabled = false;
        setStatus(
          'Tidak ada respons dari backend. Periksa URL /exec dan deployment Apps Script.',
          'error'
        );
      }, 15000);
    }

    function addField(form, name, value) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.appendChild(input);
    }

    function handleBackendMessage(event) {
      const data = event.data;

      if (
        !data ||
        data.source !== 'ABSENSI_QR_BACKEND' ||
        !pendingNonce ||
        data.nonce !== pendingNonce
      ) {
        return;
      }

      clearTimeout(saveTimer);
      pendingNonce = '';

      if (data.ok) {
        setStatus(data.message || 'Absensi berhasil disimpan.', 'ok');
        finishCurrentScan();
      } else {
        el.saveButton.disabled = false;
        el.cancelButton.disabled = false;
        setStatus(data.message || 'Data gagal disimpan.', 'error');
      }
    }

    function cancelScan() {
      setStatus('Scan dibatalkan.');
      finishCurrentScan();
    }

    function finishCurrentScan() {
      currentRawQr = '';
      scanLocked = false;
      el.result.style.display = 'none';
      el.fileInput.value = '';
      el.saveButton.disabled = false;
      el.cancelButton.disabled = false;

      if (cameraScanner && cameraRunning) {
        try { cameraScanner.resume(); } catch (ignored) {}
      }
    }

    function readableCameraError(error) {
      const name = error && error.name ? error.name : '';
      const message = error && error.message ? error.message : String(error);

      if (name === 'NotAllowedError') {
        return 'izin kamera ditolak. Buka setelan situs browser dan pilih Izinkan.';
      }
      if (name === 'NotFoundError') {
        return 'perangkat kamera tidak ditemukan.';
      }
      if (name === 'NotReadableError') {
        return 'kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/rapat video.';
      }
      if (name === 'OverconstrainedError') {
        return 'kamera belakang tidak cocok; coba browser/perangkat lain.';
      }
      return message;
    }
  </script>
</body>
</html>
